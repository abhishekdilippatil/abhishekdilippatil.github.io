<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Abhishek Patil | Project Portfolio</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="style.css">
		<script>
			(function () {
				var languages = navigator.languages || [navigator.language || "en"];
				var preferred = (languages[0] || "en").toLowerCase();
				var target = preferred.indexOf("de") === 0 ? "de/index.html" : "en/index.html";

				window.location.replace(target);
			})();
		</script>
	</head>
	<body class="home-page">
		<main class="language-hub">
			<p class="eyebrow">Project Portfolio</p>
			<h1>Redirecting you to your preferred language</h1>
			<p class="lead">If redirect does not happen automatically, choose your language below.</p>

			<div class="language-grid">
				<a class="lang-card" href="en/index.html" lang="en">
					<h2>English</h2>
					<p>Open the English version of the project portfolio.</p>
				</a>
				<a class="lang-card" href="de/index.html" lang="de">
					<h2>Deutsch</h2>
					<p>Zur deutschen Version des Projektportfolios wechseln.</p>
				</a>
			</div>

			<noscript>
				<p class="lead">JavaScript is disabled, so automatic language detection is unavailable.</p>
			</noscript>
		</main>
	</body>
</html>
